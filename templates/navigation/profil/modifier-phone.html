{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/modifier-phone.css' %}">
{% endblock %}

{% block contenu %}
<section class="profil-section smartphone-nav bg">
    <div class="profil">
        <div class="nav">
            <i>
                <a href="{% url 'infos-perso' %}">
                    <img src="{% static 'img/profil/profil-Infos-perso/arrow.png' %}" alt="" class="userimg">
                </a>
            </i>
            Informations personnelles
        </div>

        <div class="user">
            <div class="user-profil">
                <img src="{% static 'img/profil/profil-Infos-perso/user2.png' %}" alt="" class="userimg">
                <div class="add-button">
                    <img src="{% static 'img/profil/profil-Infos-perso/plus.png' %}" alt="">
                </div>
            </div>
        </div>

        <div class="infos">
            <div class="container">
                <form method="POST">
                    {% csrf_token %}
                    <div class="input-edit-infos row mt-5">
                        <div class="col-12 col-xxl-6">
                            <label for="first_name" class="form-label">Prénom</label>
                            <div class="container-input">
                                <div class="input-box">
                                    <input type="text" name="first_name" placeholder="Prénom" value="{{ user.first_name }}">
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-xxl-6">
                            <label for="last_name" class="form-label">Nom</label>
                            <div class="container-input">
                                <div class="input-box">
                                    <input type="text" name="last_name" placeholder="Nom" value="{{ user.last_name }}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 mt-3">
                        <label for="telephone" class="form-label">Téléphone</label>
                        <div class="container-input first-double">
                            <div class="input-box">
                                {{ profile_form.telephone }}
                            </div>
                        </div>
                    </div>

                    <div class="col-12 mt-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="container-input first-double">
                            <div class="input-box">
                                <input type="email" name="email" placeholder="Email" value="{{ user.email }}">
                            </div>
                        </div>
                    </div>

                    <div class="my-5 m">
                        <div class="btn-container">
                            <a href="{% url  'infos-perso' %}?mobile=1">
                                <button type="button" class="connect-btn annuler-btn">Annuler</button>
                            </a>

                            <button type="submit" class="connect-btn login-btn">
                                <img src="{% static 'img/profil/profil-Infos-perso/Saveas.png' %}" alt="Pencil">
                                Enregistrer
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

{% endblock %}
