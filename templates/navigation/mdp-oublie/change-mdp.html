{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/email-mdp.css' %}">
{% endblock %}

{% block contenu %}

<div class="bg">
    <div class="container-fluid mdp-oublie-box">

        <div class="texteValidating">
            <div class="title1 mb-2">
                Mot de passe oublié?
            </div>

            <div class="img-validation img-validation2 d-none">
                <img src="{% static 'img/mdp-oublie/mdp-oublie.png' %}" alt="mdp-oublie">
            </div>

            <div class="text-inside mb-5">
                <p>Entrez votre nouveau mot de passe</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                    <div class="text-danger small">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <div class="container-input mt-5">
                    <div class="input-box">
                        <input type="password" name="new_password" id="new_password" placeholder="Nouveau mot de passe" required>
                        <a href="javascript:void(0);" onclick="togglePassword('new_password', 'eyeNew')">
                            <img src="{% static 'img/inscription/eyeHide.png' %}" alt="eye-icon" id="eyeNew" class="eye-icon"
                                style="width: 22px;">
                        </a>
                    </div>
                </div>

                <div class="container-input mt-3">
                    <div class="input-box">
                        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirmer le mot de passe"
                            required>
                        <a href="javascript:void(0);" onclick="togglePassword('confirm_password', 'eyeConfirm')">
                            <img src="{% static 'img/inscription/eyeHide.png' %}" alt="eye-icon" id="eyeConfirm" class="eye-icon"
                                style="width: 22px;">
                        </a>
                    </div>
                </div>

                <button type="submit" class="validerButton">
                    Changer le mot de passe
                </button>
            </form>



        </div>

        <div class="img-validation img-validation1">
            <img src="{% static 'img/mdp-oublie/mdp-oublie.png' %}" alt="mdp-oublie">
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, eyeIconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(eyeIconId);

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.src = "{% static 'img/inscription/eye.png' %}";
        } else {
            passwordInput.type = "password";
            eyeIcon.src = "{% static 'img/inscription/eyeHide.png' %}";
        }
    }
</script>

{% endblock %}
